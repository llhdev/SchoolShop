name: Deploy web build to GitHub Pages

# Builds the Expo web bundle and publishes it to the gh-pages branch.
# The same URL serves the standalone website and the Telegram Mini App.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # EXPO_PUBLIC_* values are inlined into the bundle at build time, so
      # they must be present as repository secrets (Settings > Secrets).
      - name: Export web build
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Prepare dist (SPA fallback + .nojekyll)
        run: node scripts/prep-dist.js

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
