name: Deploy web build to GitHub Pages

# Builds the Expo web bundle and publishes it to the gh-pages branch.
# The same URL serves the standalone website and the Telegram Mini App.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (supply-chain hardening); the tag
      # each SHA corresponds to is noted in the comment.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # EXPO_PUBLIC_* values are inlined into the bundle at build time, so
      # they must be present as repository secrets (Settings > Secrets).
      - name: Export web build
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Prepare dist (SPA fallback + .nojekyll)
        run: node scripts/prep-dist.js

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
